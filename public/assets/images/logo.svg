<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" role="img" aria-label="AD Associates">
  <!--
    Wordmark for AD Associates.

    The previous file was a vector wordmark of the old cantina name — glyph
    outlines, not text, so it could not be renamed. It is preserved alongside
    this one as logo-previous.svg.

    Nunito is embedded by URL rather than inherited: an SVG loaded through an
    <img> tag is an isolated document and cannot see the page's @font-face
    rules. The generic fallback keeps it legible if that fetch fails.

    This is a typographic placeholder, not a designed identity — swap it for
    the real mark when you have one.
  -->
  <defs>
    <style>
      @font-face {
        font-family: "NunitoLogo";
        src: url("/assets/fonts/Nunito-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      .mark     { font-family: "NunitoLogo", "Trebuchet MS", sans-serif; font-weight: 700; }
      .initials { font-size: 54px; fill: #92843b; letter-spacing: 1px; }
      .name     { font-size: 21px; fill: #ffffff; letter-spacing: 5.5px; }
      .sub      { font-size: 11px; fill: #8a8a8a; letter-spacing: 3.4px; }
    </style>
  </defs>

  <text class="mark initials" x="0" y="52">AD</text>
  <rect x="78" y="18" width="2" height="42" fill="#92843b" opacity="0.55"/>
  <text class="mark name" x="96" y="45">ASSOCIATES</text>
  <text class="mark sub" x="96" y="70">STRATEGY &amp; ADVISORY</text>
</svg>
